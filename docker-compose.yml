version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: medai_db
    environment:
      POSTGRES_USER: medai
      POSTGRES_PASSWORD: medai123
      POSTGRES_DB: medaistudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai -d medaistudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medai_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://medai:medai123@db:5432/medaistudio
      - SECRET_KEY=medai-studio-secret-key-change-in-production
      - LOCAL_STORAGE_DIR=/app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medai_worker
    command: python -m app.worker.runner
    environment:
      - DATABASE_URL=postgresql+asyncpg://medai:medai123@db:5432/medaistudio
      - LOCAL_STORAGE_DIR=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  inference:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    container_name: medai_inference
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medai_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
